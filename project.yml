name: Burndown
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Burndown:
    type: application
    platform: iOS
    sources:
      - path: Burndown
    info:
      path: Generated/Burndown-Info.plist
      properties:
        CFBundleDisplayName: Burndown
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.burndown
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentBurn
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - BurndownTests
  BurndownTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BurndownTests
    dependencies:
      - target: Burndown
    settings:
      base:
        SWIFT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: YES
